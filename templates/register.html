<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#070D1E">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Create Account - Ledger Financial OS</title>
  <link rel="icon" type="image/png" href="/static/icons/logo-32.png">
  <link rel="manifest" href="/static/manifest.json">
  <link rel="stylesheet" href="/static/css/ledger.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      background: radial-gradient(circle at 50% 20%, #162444, var(--brand-navy-deep));
      padding: 20px;
    }
    .auth-card {
      width: 100%;
      max-width: 440px;
      background: var(--brand-card);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--brand-border);
      border-radius: var(--radius-lg);
      padding: 36px 32px;
      box-shadow: var(--shadow-lg);
      text-align: center;
    }
    .auth-logo {
      width: 72px;
      height: 72px;
      margin-bottom: 16px;
      filter: drop-shadow(0 6px 16px rgba(6, 214, 160, 0.4));
    }
    @media (max-width: 480px) {
      body {
        padding: 16px 12px;
      }
      .auth-card {
        padding: 24px 18px;
        border-radius: var(--radius-md);
      }
    }
  </style>
</head>
<body>

<div class="auth-card">
  <img src="/static/icons/logo-192.png" alt="Ledger Logo" class="auth-logo">
  <h1 style="font-size: 26px; margin-bottom: 4px;">Get Started with Ledger</h1>
  <p style="font-size: 13px; color: var(--text-secondary); margin-bottom: 24px;">Your Personal Financial Operating System</p>

  <div id="auth-error" style="display:none; padding:10px; border-radius:var(--radius-sm); background:var(--brand-danger-bg); border:1px solid rgba(239,71,111,0.3); color:var(--brand-danger); font-size:12px; margin-bottom:16px;"></div>

  <form id="register-form" onsubmit="handleRegister(event)" style="text-align: left;">
    <div class="form-group">
      <label class="form-label">Full Name</label>
      <input type="text" id="full_name" class="form-control" placeholder="e.g. Alexander Hamilton" required autofocus>
    </div>

    <div class="form-group">
      <label class="form-label">Email Address</label>
      <input type="email" id="email" class="form-control" placeholder="name@domain.com" required>
    </div>

    <div class="form-group">
      <label class="form-label">Primary Currency</label>
      <select id="currency" class="form-control">
        <option value="₹">₹ - Indian Rupee (INR)</option>
        <option value="$">$ - US Dollar (USD)</option>
        <option value="€">€ - Euro (EUR)</option>
        <option value="£">£ - British Pound (GBP)</option>
        <option value="¥">¥ - Japanese Yen (JPY)</option>
        <option value="C$">C$ - Canadian Dollar (CAD)</option>
        <option value="A$">A$ - Australian Dollar (AUD)</option>
      </select>
    </div>

    <div class="form-group">
      <label class="form-label">Password (Minimum 8 characters)</label>
      <input type="password" id="password" class="form-control" placeholder="••••••••" minlength="8" required>
    </div>

    <div style="font-size: 11.5px; color: var(--text-muted); margin-bottom: 18px; line-height: 1.4;">
      🛡️ Zero fake transactions or pre-filled data. You start with your clean, private financial operating system.
    </div>

    <button type="submit" id="submit-btn" class="btn btn-primary" style="width: 100%; padding: 12px; font-size: 14px;">
      Create Ledger Account
    </button>
  </form>

  <div style="margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--brand-border-subtle); font-size: 13px; color: var(--text-secondary);">
    Already have an account?
    <a href="/login" style="color: var(--brand-teal); font-weight: 600; text-decoration: none; margin-left: 4px;">Sign In</a>
  </div>
</div>

<script src="/static/js/api.js"></script>
<script>
async function handleRegister(e) {
  e.preventDefault();
  const full_name = document.getElementById('full_name').value.trim();
  const email = document.getElementById('email').value.trim();
  const currency = document.getElementById('currency').value;
  const password = document.getElementById('password').value;
  const errorBox = document.getElementById('auth-error');
  const btn = document.getElementById('submit-btn');

  errorBox.style.display = 'none';
  btn.disabled = true;
  btn.textContent = 'Creating account...';

  try {
    const res = await window.LedgerAPI.register(full_name, email, password, currency);
    window.location.href = '/';
  } catch (err) {
    errorBox.textContent = err.message || 'Registration failed';
    errorBox.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'Create Ledger Account';
  }
}
</script>

</body>
</html>
