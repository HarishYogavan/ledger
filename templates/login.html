<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#070D1E">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Sign In - Ledger Financial OS</title>
  <link rel="icon" type="image/png" href="/static/icons/logo-32.png">
  <link rel="manifest" href="/static/manifest.json">
  <link rel="stylesheet" href="/static/css/ledger.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      background: radial-gradient(circle at 50% 20%, #162444, var(--brand-navy-deep));
      padding: 20px;
    }
    .auth-card {
      width: 100%;
      max-width: 420px;
      background: var(--brand-card);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--brand-border);
      border-radius: var(--radius-lg);
      padding: 36px 32px;
      box-shadow: var(--shadow-lg);
      text-align: center;
    }
    .auth-logo {
      width: 72px;
      height: 72px;
      margin-bottom: 16px;
      filter: drop-shadow(0 6px 16px rgba(6, 214, 160, 0.4));
    }
    @media (max-width: 480px) {
      body {
        padding: 16px 12px;
      }
      .auth-card {
        padding: 24px 18px;
        border-radius: var(--radius-md);
      }
    }
  </style>
</head>
<body>

<div class="auth-card">
  <img src="/static/icons/logo-192.png" alt="Ledger Logo" class="auth-logo">
  <h1 style="font-size: 26px; margin-bottom: 4px;">Ledger</h1>
  <p style="font-size: 13px; color: var(--text-secondary); margin-bottom: 24px;">Your Personal Financial Operating System</p>

  <div id="auth-error" style="display:none; padding:10px; border-radius:var(--radius-sm); background:var(--brand-danger-bg); border:1px solid rgba(239,71,111,0.3); color:var(--brand-danger); font-size:12px; margin-bottom:16px;"></div>

  <form id="login-form" onsubmit="handleLogin(event)" style="text-align: left;">
    <div class="form-group">
      <label class="form-label">Email Address</label>
      <input type="email" id="email" class="form-control" placeholder="name@domain.com" required autofocus>
    </div>

    <div class="form-group">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <label class="form-label">Password</label>
        <a href="/reset-password" style="font-size:12px; color:var(--brand-teal); text-decoration:none;">Forgot?</a>
      </div>
      <input type="password" id="password" class="form-control" placeholder="••••••••" required>
    </div>

    <button type="submit" id="submit-btn" class="btn btn-primary" style="width: 100%; padding: 12px; font-size: 14px; margin-top: 10px;">
      Sign In to Ledger
    </button>
  </form>

  <div style="margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--brand-border-subtle); font-size: 13px; color: var(--text-secondary);">
    Don't have a Ledger account?
    <a href="/register" style="color: var(--brand-teal); font-weight: 600; text-decoration: none; margin-left: 4px;">Create Account</a>
  </div>
</div>

<script src="/static/js/api.js"></script>
<script>
// Check for valid existing persistent session before showing login form
(async function checkExistingSession() {
  const token = window.LedgerAPI.getToken();
  if (token) {
    const card = document.querySelector('.auth-card');
    if (card) card.style.display = 'none';

    let splash = document.createElement('div');
    splash.id = 'auth-splash-loader';
    splash.style.cssText = 'display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; min-height:300px;';
    splash.innerHTML = `
      <img src="/static/icons/logo-192.png" alt="Ledger" style="width:72px; height:72px; filter:drop-shadow(0 0 20px rgba(6,214,160,0.4));">
      <div style="font-size:18px; font-weight:700; color:#F8FAFC; letter-spacing:-0.02em;">Ledger</div>
      <div style="font-size:12px; color:#94A3B8; display:flex; align-items:center; gap:8px;">
        <div class="spinner" style="width:14px; height:14px; border-width:2px; margin:0;"></div>
        <span>Restoring your session...</span>
      </div>
    `;
    document.body.appendChild(splash);

    const authRes = await window.LedgerAuth.checkSession();
    if (authRes.authenticated) {
      window.location.replace('/#dashboard');
      return;
    }

    splash.remove();
    if (card) card.style.display = 'block';
  }
})();

async function handleLogin(e) {
  e.preventDefault();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const errorBox = document.getElementById('auth-error');
  const btn = document.getElementById('submit-btn');

  if (!email || !password) {
    errorBox.textContent = 'Please enter both your email address and password';
    errorBox.style.display = 'block';
    return;
  }

  errorBox.style.display = 'none';
  btn.disabled = true;
  btn.textContent = 'Signing you in...';

  try {
    // 1. Send authentication request & verify credentials
    await window.LedgerAuth.login(email, password);

    // 2. Transition loading state
    btn.textContent = 'Loading Ledger...';

    // 3. Pre-warm financial data
    try {
      await Promise.all([
        window.LedgerAPI.getOverview().catch(() => null),
        window.LedgerAPI.getHealth().catch(() => null)
      ]);
    } catch (e) {
      // Non-blocking pre-warm
    }

    // 4. Open the main Dashboard directly
    window.location.replace('/#dashboard');
  } catch (err) {
    errorBox.textContent = err.message || 'Invalid email or password';
    errorBox.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'Sign In to Ledger';
  }
}
</script>

</body>
</html>
