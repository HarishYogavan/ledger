<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - Ledger Financial OS</title>
  <link rel="icon" type="image/png" href="/static/icons/logo-32.png">
  <link rel="stylesheet" href="/static/css/ledger.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: radial-gradient(circle at 50% 20%, #162444, var(--brand-navy-deep));
      padding: 20px;
    }
    .auth-card {
      width: 100%;
      max-width: 420px;
      background: var(--brand-card);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--brand-border);
      border-radius: var(--radius-lg);
      padding: 36px 32px;
      box-shadow: var(--shadow-lg);
      text-align: center;
    }
    .auth-logo {
      width: 68px;
      height: 68px;
      margin-bottom: 16px;
      filter: drop-shadow(0 6px 16px rgba(6, 214, 160, 0.4));
    }
  </style>
</head>
<body>

<div class="auth-card">
  <img src="/static/icons/logo-192.png" alt="Ledger Logo" class="auth-logo">
  <h1 style="font-size: 24px; margin-bottom: 4px;">Reset Password</h1>
  <p style="font-size: 13px; color: var(--text-secondary); margin-bottom: 24px;">Enter your email address and new password to restore access.</p>

  <div id="status-box" style="display:none; padding:10px; border-radius:var(--radius-sm); font-size:12px; margin-bottom:16px;"></div>

  <form id="reset-form" onsubmit="handleReset(event)" style="text-align: left;">
    <div class="form-group">
      <label class="form-label">Account Email</label>
      <input type="email" id="email" class="form-control" placeholder="name@domain.com" required autofocus>
    </div>

    <div class="form-group">
      <label class="form-label">New Password (min 8 chars)</label>
      <input type="password" id="new_password" class="form-control" placeholder="••••••••" minlength="8" required>
    </div>

    <button type="submit" id="submit-btn" class="btn btn-primary" style="width: 100%; padding: 12px; font-size: 14px; margin-top: 8px;">
      Update Password
    </button>
  </form>

  <div style="margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--brand-border-subtle); font-size: 13px; color: var(--text-secondary);">
    Remembered your password?
    <a href="/login" style="color: var(--brand-teal); font-weight: 600; text-decoration: none; margin-left: 4px;">Back to Sign In</a>
  </div>
</div>

<script src="/static/js/api.js"></script>
<script>
async function handleReset(e) {
  e.preventDefault();
  const email = document.getElementById('email').value.trim();
  const new_password = document.getElementById('new_password').value;
  const statusBox = document.getElementById('status-box');
  const btn = document.getElementById('submit-btn');

  statusBox.style.display = 'none';
  btn.disabled = true;

  try {
    const res = await window.LedgerAPI.request('/api/auth/reset-password', {
      method: 'POST',
      body: JSON.stringify({ email, new_password })
    });
    statusBox.style.display = 'block';
    statusBox.style.background = 'var(--brand-teal-glow)';
    statusBox.style.border = '1px solid var(--brand-teal)';
    statusBox.style.color = 'var(--brand-teal)';
    statusBox.textContent = res.message || 'Password updated successfully!';
    setTimeout(() => { window.location.href = '/login'; }, 1500);
  } catch (err) {
    statusBox.style.display = 'block';
    statusBox.style.background = 'var(--brand-danger-bg)';
    statusBox.style.border = '1px solid var(--brand-danger)';
    statusBox.style.color = 'var(--brand-danger)';
    statusBox.textContent = err.message || 'Failed to update password';
    btn.disabled = false;
  }
}
</script>

</body>
</html>
